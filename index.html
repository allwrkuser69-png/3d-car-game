<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Car Racer</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#111}#ui{position:fixed;z-index:2;top:15px;left:15px;color:white;background:#0009;padding:12px 16px;border-radius:12px;line-height:1.7}#start{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#06101dcc;color:white;text-align:center}.box{background:#111e;padding:35px;border-radius:22px;border:1px solid #ffffff33}button{padding:13px 24px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}</style></head><body><div id="ui">SPEED: <b id="sp">0</b> km/h<br>LAP: <b id="lap">1</b>/3<br><small>WASD / Arrow Keys • R Reset</small></div><div id="start"><div class="box"><h1>🏎️ 3D CAR RACER</h1><p>Drive around the track and complete 3 laps.</p><button onclick="startGame()">START GAME</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b8dc);scene.fog=new THREE.Fog(0x87b8dc,80,350);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xddeeff,0x335522,2));
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-50,80,40);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x39743b}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const roadMat=new THREE.MeshStandardMaterial({color:0x282b31});
const road=new THREE.Mesh(new THREE.PlaneGeometry(22,320),roadMat);road.rotation.x=-Math.PI/2;road.position.y=.02;scene.add(road);
const lineMat=new THREE.MeshStandardMaterial({color:0xffffff});
for(let z=-155;z<160;z+=10){let l=new THREE.Mesh(new THREE.BoxGeometry(.18,.03,5),lineMat);l.position.set(0,.06,z);scene.add(l)}
function cube(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
for(let z=-155;z<160;z+=14){cube(1,1,1.5,0x8b4f2b,-15,0.5,z);cube(1,1,1.5,0x8b4f2b,15,0.5,z);let a=cube(4,7,4,0x24652f,-15,4,z+2);a.geometry=new THREE.ConeGeometry(4,7,8);let b=cube(4,7,4,0x24652f,15,4,z+2);b.geometry=new THREE.ConeGeometry(4,7,8)}
function car(color){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(2.2,.55,4.2),new THREE.MeshStandardMaterial({color}));b.position.y=.8;g.add(b);let c=new THREE.Mesh(new THREE.BoxGeometry(1.65,.8,1.8),new THREE.MeshStandardMaterial({color:0x17283a,roughness:.2}));c.position.set(0,1.35,.5);g.add(c);for(let x of[-1.18,1.18])for(let z of[-1.35,1.35]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.3,18),new THREE.MeshStandardMaterial({color:0x111111}));w.rotation.z=Math.PI/2;w.position.set(x,.5,z);g.add(w)}return g}
const player=car(0xe53935);player.position.set(0,0,120);scene.add(player);
let keys={},speed=0,lap=1,playing=false;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;keys[e.key]=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys[e.key]=false});
function reset(){player.position.set(0,0,120);speed=0;lap=1;playing=true;document.getElementById('start').style.display='none'}
window.startGame=()=>reset();
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.035);if(playing){if(keys.w||keys.ArrowUp)speed+=25*dt;else speed-=8*dt;if(keys.s||keys.ArrowDown)speed-=30*dt;speed=Math.max(0,Math.min(45,speed));let steer=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0);player.position.x+=steer*speed*.055*dt;player.position.x=Math.max(-8,Math.min(8,player.position.x));player.position.z-=speed*dt;if(player.position.z<-158){lap++;player.position.z=158}if(lap>3){playing=false;document.getElementById('start').style.display='grid';document.querySelector('#start h1').textContent='🏆 RACE COMPLETE!'}document.getElementById('sp').textContent=Math.round(speed*3.6);document.getElementById('lap').textContent=Math.min(lap,3);camera.position.lerp(new THREE.Vector3(player.position.x,5,player.position.z+9),.08);camera.lookAt(player.position.x,1,player.position.z-8)}renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
